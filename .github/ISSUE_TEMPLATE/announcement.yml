name: Add a Brightspace announcement
description: Add a one-line summary of a course announcement so the hub shows it (the site cannot read Brightspace itself).
title: "[Announcement] "
labels: ["announcement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! One or two sentences is plenty: the hub shows summaries only and sends readers to Brightspace for the full text.
        No grades, names of other students, or personal details. The hub shows the title, date and summary below within a few
        hours (long texts are cut to about 300 characters). Closing this issue removes it from the hub.
  - type: input
    id: date
    attributes:
      label: Date
      description: When the course posted it (YYYY-MM-DD).
      placeholder: "2026-09-04"
    validations:
      required: true
  - type: textarea
    id: text
    attributes:
      label: What it says
      description: A short, faithful summary (one or two sentences). Not the whole announcement.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      description: Optional link to the announcement on Brightspace (login required).
      placeholder: "https://brightspace.cuny.edu/d2l/le/news/1315489/..../view"
